<!DOCTYPE html>
<html>

<!-- 头部 -->
<head>
    <meta charset="utf-8">
    <title>摆渡人(runoob.com)</title>

    <link rel="icon" href="测试图片/活动图标素材.png" type="image/png">

    <title>简单按钮示例</title>
    <style>
        /* 按钮基础样式 */
        #myButton {
            position: fixed; /* 固定定位 */
            right: 610px; /* 距离右侧 20px */
            bottom: 200px; /* 距离底部 20px */
        }

        #myButton {
            padding: 10px 20px; /* 上下内边距10px，左右内边距20px */
            font-size: 16px; /* 文字大小 */
            color: darkmagenta; /* 文字颜色 */
            background-color: wheat; /* 背景颜色（蓝色） */
            border: none; /* 移除边框 */
            border-radius: 5px; /* 圆角 */
            cursor: pointer; /* 鼠标悬停时显示手型 */
            transition: background-color 0.3s; /* 背景色过渡动画 */
        }

            /* 鼠标悬停效果 */
            #myButton:hover {
                background-color: #0056b3; /* 悬停时背景变深 */
            }
    </style>
</head>

<!-- 身体 -->
<body style="background-image: url('测试图片/虚空角色背景素材.jpg');">
    <!-- 背景设置 -->
    <style>
        body {
            margin: 0; /* 移除默认边距 */
            height: 100vh; /* 确保 body 占满整个视口高度 */
            /* 背景图片设置 */
            background-image: url('background/light.jpg'); /* 替换为你的图片路径 */
            background-size: cover; /* 图片覆盖整个容器，保持比例 */
            background-repeat: no-repeat; /* 防止图片重复 */
            background-position: center; /* 图片居中显示 */
            background-attachment: fixed; /* 可选：背景固定，不随滚动移动 */
        }
    </style>

    <!-- 按钮HTML结构 -->
    <button id="myButton">下载</button>

    <script>
        // 获取按钮元素
        const button = document.getElementById('myButton');

        // 定义点击事件处理函数
        button.addEventListener('click', function () {

            // 1. 创建 <a> 元素
            const link = document.createElement('a');

            // 2. 设置相对路径（确保图片在本地服务器可访问）
            link.href = '测试图片/虚空角色背景素材.jpg'; // 相对于当前 HTML 文件的路径

            // 3. 设置下载文件名
            link.download = '虚空角色背景素材.jpg';

            // 4. 隐藏并触发下载
            link.style.display = 'none';
            document.body.appendChild(link);
            link.click();
            document.body.removeChild(link);

            //alert('下载成功！'); // 点击时弹出提示

        });
    </script>

    <!-- 装饰图 -->
    <h1>摆渡人</h1>
    <style>
        body {
            margin: 0;
            height: 100vh; /* 让 body 占满整个视口高度 */
            
            /* 启用 Flex 布局 */
            display: flex;
            
            /* 水平居中 */
            justify-content: center;

        }
        h1 {
            margin: 0; /* 移除 h1 默认的外边距 */
            /* 方法 1：直接用 margin-top 控制距离顶部 */
            margin-top: 100px;
            /* 可选：调整文字颜色、大小等 */
            color: white;
            font-size: 90px;
        }
    </style>
</body>
</html>
