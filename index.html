<!DOCTYPE html>
<html>
<head>
    <meta charset="UTF-8">

    <title>
        梦境入口
    </title>

    <link rel="icon" href="background/light.jpg" type="image/png">

    <style>

        /* 方法 1：隐藏整个页面的滚动条（推荐） */
        html, body {
            margin: 0; /* 移除默认边距 */
            padding: 0; /* 移除默认内边距 */
            overflow-x: hidden; /* 隐藏横向滚动条 */
            overflow-y: hidden; /* 隐藏横向滚动条 */

            height: 100%; /* 确保 body 占满整个视口 */
            width: 100%; /* 确保 body 占满整个视口宽度 */
        }
    </style>

    <!--<script>
        // 只在需要时清理缓存（比如首次访问或特定条件下）
        if (!sessionStorage.getItem('cacheCleared')) {
            if ('caches' in window) caches.keys().then(keys => keys.forEach(key => caches.delete(key)));
            localStorage.clear();
            sessionStorage.setItem('cacheCleared', 'true');
            // 移除 location.reload(true) 避免循环刷新
        }
    </script>-->

</head>

<body style="background-image: url('background/照相墙壁背景素材.jpg');">

    <div id="container" style="width:1920px">

        <!-- -------------------------------------------------------------------------- -->

        <iframe id="my-iframe"
                src="/WWWW/index.html"
                style="position: absolute; border: none;"></iframe>

        <script>
            const iframe = document.getElementById('my-iframe');  // 1. 获取 iframe 元素
            iframe.style.left = '-313px';                          // 2. 设置 iframe 的 left 位置
            iframe.style.top = '-200px';                            // 3. 设置 iframe 的 top 位置
            iframe.style.width = '1920px';                         // 4. 设置 iframe 的宽度
            iframe.style.height = '1080px';                        // 5. 设置 iframe 的高度
        </script>

        <!-- --------------------------------------------------------------------------Unity-->

        <style>
            body {
                margin: 0; /* 移除默认边距 */
                height: 100vh; /* 确保 body 占满整个视口高度 */
                /* 背景图片设置 */
                background-image: url('background/light.jpg'); /* 替换为你的图片路径 */
                background-size: cover; /* 图片覆盖整个容器，保持比例 */
                background-repeat: no-repeat; /* 防止图片重复 */
                background-position: center; /* 图片居中显示 */
                background-attachment: fixed; /* 可选：背景固定，不随滚动移动 */
            }
        </style>

        <!-- --------------------------------------------------------------------------背景相关-->
        <!-- --------------------------------------------------------------------------标签页-->

        <script>
            // 极简兼容性检测
            // 检查三个关键条件，如果任意一个不满足就显示兼容性警告

            if (!document.createElement('canvas').getContext('webgl') ||  // 1. 检查WebGL支持
                typeof Promise === 'undefined' ||                         // 2. 检查Promise支持
                navigator.userAgent.includes('MSIE')) {                   // 3. 检查是否为IE浏览器

                // 如果上述任一条件为真（即浏览器不兼容），则显示警告元素
                alert('⚠️ 您的浏览器不兼容webgl，请使用现代浏览器访问，或下载pc端');
            }
        </script>

        <script>
            // 阻止默认快捷键行为
            document.addEventListener('keydown', function (e) {
                // 阻止空格键滚动页面
                if (e.code === 'Space' && e.target === document.body) {
                    e.preventDefault();
                }
                // 阻止方向键滚动页面
                if (['ArrowUp', 'ArrowDown', 'ArrowLeft', 'ArrowRight'].includes(e.code)) {
                    e.preventDefault();
                }
                // 阻止PageUp/PageDown
                if (['PageUp', 'PageDown'].includes(e.code)) {
                    e.preventDefault();
                }
                // 阻止Home/End
                if (['Home', 'End'].includes(e.code)) {
                    e.preventDefault();
                }


            });
        </script>

        <style>
            /* 一步到位：移除 iframe 和容器的边框/轮廓 */
            iframe, #container {
                border: 0;
                outline: 0;
            }

            body {
                margin: 0;
            }
            /* 可选：防止页面默认边距影响 */
        </style>

        <style>
            /* 清除所有元素的默认边距和边框 */
            * {
                margin: 0;
                padding: 0;
                border: 0;
                outline: 0;
            }

            /* 确保 iframe 占满容器 */
            #container {
                width: 100vw; /* 视口宽度 */
                height: 100vh; /* 视口高度 */
                overflow: hidden; /* 防止滚动条 */
            }

            #my-iframe {
                width: 100%;
                height: 100%;
            }
        </style>

    </div>
</body>

</html>
